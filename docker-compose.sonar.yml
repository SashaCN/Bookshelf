# Local SonarQube (Community Build). Start with `make sonar-up`, analyse with `make sonar`.
# UI: http://localhost:9002 (first login admin / admin, you are asked to change the password).
name: bookshelf-sonar

services:
  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
      # Lets Elasticsearch start without raising vm.max_map_count on the host (WSL2, Docker Desktop).
      SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
    ports:
      - "127.0.0.1:${SONAR_PORT:-9002}:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_extensions:/opt/sonarqube/extensions

  sonar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Run on demand: `docker compose -f docker-compose.sonar.yml run --rm scanner`.
  # The repository is mounted at /var/www/html, the same path as in the PHP container, so the absolute
  # file paths inside backend/coverage/clover.xml match the files the scanner sees.
  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles: [scan]
    depends_on:
      - sonarqube
    working_dir: /var/www/html
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: ${SONAR_TOKEN:-}
    volumes:
      - .:/var/www/html

volumes:
  sonar_data:
  sonar_extensions:
  sonar_db:
