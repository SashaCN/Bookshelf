; Production overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M

; Books for the reader (EPUB files up to 15 MB) are uploaded through the API.
upload_max_filesize = 20M
post_max_size = 22M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; The code never changes inside a running container, so PHP does not need to re-check files.
opcache.validate_timestamps = 0
