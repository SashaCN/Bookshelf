server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    client_max_body_size 2m;

    # The only request with a big body: the EPUB file of a reader (the limit of the API is 15 MB, plus multipart
    # overhead). Everything else keeps the small default limit, also for readers who are not signed in.
    location ~ ^/api/library/[0-9]+/text$ {
        client_max_body_size 25m;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Laravel: the API, the generated API docs and the health check.
    location ~ ^/(api|docs|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Everything else is the Vue SPA served by the Vite dev server (with HMR over WebSocket).
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
