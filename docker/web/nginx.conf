server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 10m;

    # Laravel: the API, the generated API docs and the health check.
    location ~ ^/(api|docs|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Built assets have a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else is the SPA. The entry point must never be cached, otherwise readers
    # would keep an old version after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
