server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # The only request with a big body: the EPUB file of a reader (the limit of the API is 15 MB, plus multipart
    # overhead). Everything else keeps the small default limit, also for readers who are not signed in.
    location ~ ^/api/library/[0-9]+/text$ {
        client_max_body_size 25m;
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Laravel: the API, the generated API docs and the health check.
    location ~ ^/(api|docs|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_read_timeout 60s;
    }

    # Built assets have a content hash in their name, so they can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The manifest has a file type this nginx does not know. Like the service worker (sw.js, handled below), it must
    # not be cached for long: browsers check both for changes.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Everything else is the SPA. The entry point must never be cached, otherwise readers
    # would keep an old version after a deploy. That also holds for /sw.js: a stale service worker would keep
    # serving a stale app.
    #
    # The Content-Security-Policy is a second line of defence: the only place where the app inserts HTML it did not
    # write itself is the text of a book (v-html), and it is rebuilt by the server from an allow-list. Even if
    # something slipped through, scripts could run only from the app's own files, and nothing could be sent to
    # another site. Images may come from any https address (the covers of Open Library are redirected to Internet
    # Archive servers); blob: and data: are the quote card and downloads. It is set here and not in Caddy because
    # the API documentation under /docs has its own, different needs.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
