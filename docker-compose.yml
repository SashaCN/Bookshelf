# Local development stack. Everything runs in containers, so the host only needs Docker.
# Open the app at http://localhost:8000 (nginx serves the SPA and proxies /api to Laravel).
# Another port can be chosen with WEB_PORT in a root-level .env file (e.g. WEB_PORT=8090).
name: bookshelf

x-backend-env: &backend-env
  APP_NAME: Bookshelf
  APP_ENV: local
  # Development-only key. Production must set its own APP_KEY.
  APP_KEY: ${APP_KEY:-base64:+RqiB/7EtNQDC7sdsV8ZM0cRYgVFUjwnR4YunZIDMlg=}
  APP_DEBUG: "true"
  APP_URL: http://localhost:${WEB_PORT:-8000}
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: bookshelf
  DB_USERNAME: bookshelf
  DB_PASSWORD: bookshelf
  DB_CHARSET: utf8mb4
  DB_COLLATION: utf8mb4_0900_ai_ci
  # Long-lived session (30 days) so the installed PWA does not ask to sign in again.
  SESSION_DRIVER: database
  SESSION_LIFETIME: "43200"
  SESSION_DOMAIN: "null"
  # The SPA is served from the same origin as the API (nginx on WEB_PORT).
  SANCTUM_STATEFUL_DOMAINS: localhost:${WEB_PORT:-8000},127.0.0.1:${WEB_PORT:-8000}
  CACHE_STORE: database
  QUEUE_CONNECTION: database
  MAIL_MAILER: log
  # Book catalog. Point these at a local stand-in to work offline.
  OPENLIBRARY_BASE_URL: ${OPENLIBRARY_BASE_URL:-https://openlibrary.org}
  OPENLIBRARY_COVERS_URL: ${OPENLIBRARY_COVERS_URL:-https://covers.openlibrary.org}

services:
  web:
    image: nginx:1.28-alpine
    ports:
      - "${WEB_PORT:-8000}:80"
    volumes:
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/html/public:ro
    depends_on:
      - app
      - frontend

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    volumes:
      - ./backend:/var/www/html
    environment:
      <<: *backend-env
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    environment:
      WEB_PORT: ${WEB_PORT:-8000}
    volumes:
      - ./frontend:/app
    command: sh -c "[ -d node_modules ] || npm ci; exec npm run dev"

  mysql:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bookshelf
      MYSQL_USER: bookshelf
      MYSQL_PASSWORD: bookshelf
    ports:
      # Exposed on localhost only, for a DB client such as TablePlus.
      - "127.0.0.1:${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
