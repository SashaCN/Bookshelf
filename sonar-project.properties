# SonarQube analysis for both apps. The same file is used by the local stack (make sonar)
# and by the CI job. Coverage reports are produced by `make coverage`.
sonar.projectKey=bookshelf
sonar.projectName=Bookshelf

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/vendor/**
sonar.coverage.exclusions=backend/app/Providers/**

sonar.php.coverage.reportPaths=backend/coverage/clover.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
