# SonarQube analysis. The same file is used by the local stack (make sonar) and by the CI job.
# The coverage report of the backend is produced by `make coverage`.
sonar.projectKey=bookshelf
sonar.projectName=Bookshelf

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.spec.ts
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/vendor/**,backend/database/migrations/**
sonar.coverage.exclusions=backend/app/Providers/**,frontend/src/sw/**

sonar.php.coverage.reportPaths=backend/coverage/clover.xml
# The frontend coverage report needs @vitest/coverage-v8, which the project does not have yet. Once it is added
# (`npm run test:coverage`), uncomment the line below.
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
